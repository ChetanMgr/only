<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Quiz Final</title>
<style>
body{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:#ffe6eb;
  font-family:Arial;
  overflow:hidden;
  position:relative;
}

.box{
  background:white;
  padding:30px;
  border-radius:15px;
  text-align:center;
  width:320px;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
  position:relative;
  z-index:1;
}

input{
  padding:8px;
  width:90%;
  margin-top:10px;
}

button{
  margin:10px;
  padding:8px 20px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

#yes{background:#2ecc71;color:white;}
#no{background:#e74c3c;color:white;}

.hidden{display:none}

.heart{
  font-size:70px;
  color:red;
  position:relative;
  display:inline-block;
  cursor:pointer;
  margin-top:15px;
}

img{
  width:200px;
  border-radius:12px;
  margin-top:10px;
}

/* Floating icons */
.floating{
  position:absolute;
  font-size:20px;
  animation:fall 3s linear forwards;
}

@keyframes fall{
  0%{opacity:1; transform:translateY(0);}
  100%{opacity:0; transform:translateY(600px) rotate(360deg);}
}

#holdText{
  margin-top:10px;
  font-weight:bold;
  color:#e91e63;
}
</style>
</head>
<body>

<div class="box">

  <!-- INTRO -->
  <div id="introBox">
    <h2>Before I ask something... be honest ❤️</h2>
    <button id="startBtn">Continue</button>
  </div>

  <!-- QUESTION -->
  <h3 id="q" class="hidden"></h3>

  <!-- TEXT INPUT -->
  <div id="textBox" class="hidden">
    <input id="input" placeholder="Type here...">
    <br>
    <button onclick="nextText()">Continue</button>
  </div>

  <!-- YES NO -->
  <div id="ynBox" class="hidden">
    <button id="yes" onclick="yes()">Yes</button>
    <button id="no" onclick="no()">No</button>
  </div>

  <!-- RESULT -->
  <div id="result" class="hidden">
    <h3 id="topText">I know you clicke yes for me 😄</h3>
    <img id="resultImg" src="main.jpeg">
    <h3 id="bottomText">Your answers almost match my questions and type ❤️</h3>
    <div class="heart" id="resultHeart">❤️ 0%</div>
    <div id="holdText">Press and hold the heart</div>
  </div>

</div>

<script>
const textQuestions = [
  "Describe yourself in one word",
  "What makes you happy?",
  "What do you value most?",
  "Your favorite memory type?",
  "What kind of person are you?"
];

const ynQuestions = [
  "Do you like deep talks?",
  "Do you believe in loyalty?",
  "Do you enjoy late night chats?",
  "Would you stay during hard times?"
];

const finalQ = "Last question... Do you like me? ❤️";

let step = 0;
let isFinal = false;
let yesCount = 0;

const introBox = document.getElementById("introBox");
const startBtn = document.getElementById("startBtn");
const q = document.getElementById("q");
const textBox = document.getElementById("textBox");
const ynBox = document.getElementById("ynBox");
const result = document.getElementById("result");
const input = document.getElementById("input");
const noBtn = document.getElementById("no");
const resultHeart = document.getElementById("resultHeart");

// START QUIZ
startBtn.onclick = () => {
  introBox.classList.add("hidden");
  q.classList.remove("hidden");
  textBox.classList.remove("hidden");
  q.innerText = textQuestions[0];
  step = 0;
};

// TEXT QUESTIONS (1–5)
function nextText(){
  input.value = "";
  step++;
  if(step < textQuestions.length){
    q.innerText = textQuestions[step];
  } else {
    step = 0;
    textBox.classList.add("hidden");
    ynBox.classList.remove("hidden");
    q.innerText = ynQuestions[0];
    noBtn.style.transform = "translate(0,0)";
  }
}

// YES CLICK
function yes(){
  yesCount++;
  nextYN();
}

// NO CLICK
function no(){
  if(isFinal){
    moveNoButton();
  } else {
    nextYN();
  }
}

// RUNAWAY BUTTON
function moveNoButton(){
  const x = Math.random()*180 - 90;
  const y = Math.random()*120 - 60;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
}

// YES/NO QUESTIONS (6–9 and final)
function nextYN(){
  step++;
  if(step < ynQuestions.length){
    q.innerText = ynQuestions[step];
    ynBox.classList.remove("hidden");
    noBtn.style.transform = "translate(0,0)";
  }
  else if(step === ynQuestions.length){
    ynBox.classList.add("hidden");
    q.classList.add("hidden");
    introBox.classList.remove("hidden");

    // Change intro text for final question
    introBox.querySelector('h2').innerText = "i bet you if you can click no 'i will give you everything you want'";
    startBtn.innerText = "Continue";

    startBtn.onclick = () => {
      introBox.classList.add("hidden");
      ynBox.classList.remove("hidden");
      q.classList.remove("hidden");
      q.innerText = finalQ;
      isFinal = true; // activate runaway No button
    };
}

  else{
    ynBox.classList.add("hidden");
    q.classList.add("hidden");
    result.classList.remove("hidden");

    const totalQuestions = textQuestions.length + ynQuestions.length + 1;
    const percentage = Math.round((yesCount / totalQuestions) * 100);
    resultHeart.innerText = `❤️ ${percentage}%`;
  }
}

// FLOWERS & HEARTS ON HOLD
let holdInterval;
resultHeart.addEventListener('mousedown', () => {
  holdInterval = setInterval(() => {
    createFloatingIcon();
  }, 100);
});
resultHeart.addEventListener('mouseup', () => clearInterval(holdInterval));
resultHeart.addEventListener('mouseleave', () => clearInterval(holdInterval));

function createFloatingIcon(){
  const icons = ['🌸','❤️','💖','💐', 'you are so beautiful'];
  const icon = icons[Math.floor(Math.random()*icons.length)];
  const div = document.createElement('div');
  div.classList.add('floating');
  div.innerText = icon;
  // append inside the quiz box
  const box = document.querySelector('.box');
  div.style.left = Math.random() * (box.clientWidth - 30) + 'px';
  div.style.top = Math.random() * (box.clientHeight - 30) + 'px';
  div.style.fontSize = Math.random()*30+15+'px';
  box.appendChild(div);
  setTimeout(()=>div.remove(),3000);
}

</script>
</body>
</html>
